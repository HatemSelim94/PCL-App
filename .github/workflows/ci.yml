name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: Core and Python tests (Linux, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install PCL, VTK with Qt, and Python headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcl-dev libvtk9-qt-dev qtbase5-dev qttools5-dev-tools python3-dev python3-venv

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPCLAPP_BUILD_APP=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build and install the Python package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install ".[test]"

      - name: Python tests
        run: .venv/bin/python -m pytest

      - name: Build the desktop application
        run: |
          cmake -S . -B build-app -DCMAKE_BUILD_TYPE=Release -DPCLAPP_BUILD_APP=ON -DPCLAPP_BUILD_TESTS=OFF
          cmake --build build-app --parallel
