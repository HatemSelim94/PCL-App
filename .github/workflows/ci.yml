name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (Ubuntu 24.04, GCC, PCL 1.14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install PCL, VTK with Qt, and Python headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcl-dev libvtk9-qt-dev qtbase5-dev qttools5-dev-tools python3-dev python3-venv

      - name: Configure
        run: cmake --preset core

      - name: Build
        run: cmake --build --preset core --parallel

      - name: Test
        run: ctest --preset core

      - name: Build and install the Python package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install ".[test]"

      - name: Python tests
        run: .venv/bin/python -m pytest

      - name: Build the desktop application
        run: |
          cmake --preset app
          cmake --build --preset app --parallel

  windows:
    name: Windows (Visual Studio 2022, PCL from vcpkg)
    runs-on: windows-2022
    timeout-minutes: 240  # the first run builds PCL and Boost from source
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      # vcpkg's binary cache: finished packages go here and are restored from
      # here, so only the first run (or a dependency change) compiles PCL.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake
    steps:
      - uses: actions/checkout@v4

      - name: Read the vcpkg baseline from the manifest
        id: baseline
        shell: bash
        run: echo "commit=$(python -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")" >> "$GITHUB_OUTPUT"

      - name: Check out vcpkg at the manifest's baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout ${{ steps.baseline.outputs.commit }}
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore the vcpkg binary cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure (installs the dependencies through vcpkg)
        run: cmake --preset core-vcpkg

      # Saved right after the dependencies are built, and even if a later step
      # fails, so an hour of compiling is never lost.
      - name: Save the vcpkg binary cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build --preset core-vcpkg

      - name: Test
        run: ctest --preset core-vcpkg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install the Python package
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install ".[test]"

      - name: Python tests
        run: .venv\Scripts\python -m pytest

  docker:
    name: Docker image (core tests, Python tests, MCP server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (runs both test suites inside)
        run: docker build -t pclapp .

      - name: Smoke test the server
        run: |
          docker run --rm --entrypoint /opt/pclapp/bin/python pclapp -c "import pclapp; print(pclapp.__file__)"
          docker run --rm pclapp --help
