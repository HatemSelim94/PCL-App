name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: Core and Python tests (Linux, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install PCL and Python headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcl-dev python3-dev python3-venv

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPCLAPP_BUILD_APP=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build and install the Python package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install ".[test]"

      - name: Python tests
        run: .venv/bin/python -m pytest
