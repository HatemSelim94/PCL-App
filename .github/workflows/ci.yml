name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: Core unit tests (Linux, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install PCL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPCLAPP_BUILD_APP=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
